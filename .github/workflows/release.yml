name: Release

# Cut by pushing a tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Versions are never written down in this repo. The tag is the only place a
# release number exists, and everything downstream is stamped from it, so there
# is no file to forget to bump.

on:
  push:
    tags: ['v*']
  # The manual path, for re-cutting a release whose publish failed halfway.
  # It defaults to a dry run so a stray click cannot publish anything.
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, with or without the v
        required: true
        type: string
      dry_run:
        description: Build and rehearse, but publish nothing
        required: false
        type: boolean
        default: true

# Publishing to npm cannot be undone, so two runs must never race. Queue rather
# than cancel: a half-finished release is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

permissions:
  id-token: write
  contents: read

jobs:
  # Everything else waits on this. It builds all four platforms, publishes them
  # to a local registry, installs them, and checks that what comes out works.
  # Finding a packaging bug here costs a rerun; finding it after npm has the
  # version costs a version, permanently.
  rehearse:
    name: Rehearse the publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm/rehearse.sh

  publish:
    name: Publish
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to create the GitHub release
      id-token: write # to sign the npm packages with provenance
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Node 24 for npm 11: trusted publishing needs npm 11.5.1 or newer, and
      # node 22 ships npm 10.9. Provenance worked there, which is why every
      # release so far was fine and this would not have been.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Work out what is being released
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.version }}"
          else
            raw="$GITHUB_REF_NAME"
          fi
          version=${raw#v}

          # A tag that is not a version would otherwise be discovered by npm
          # rejecting it, after the GitHub release had already been cut.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "'$raw' is not a version this can release" >&2
            exit 1
          fi

          # npm insists on being told which dist-tag a prerelease goes to
          # rather than guessing, and the tag already says: v0.2.0-beta.1
          # installs as @grove-sh/cli@beta. An identifier off this list would
          # make a dist-tag nobody would think to ask for, so it lands on next.
          #
          # This keeps a prerelease off latest for every publish but the first.
          # npm points latest at whatever version created the package, --tag or
          # not, so the first release is what a bare install gets whatever it
          # is called.
          prerelease=false
          npm_tag=latest
          case "$version" in
            *-*)
              prerelease=true
              npm_tag=next
              case "${version#*-}" in
                alpha*) npm_tag=alpha ;;
                beta*) npm_tag=beta ;;
                rc*) npm_tag=rc ;;
              esac
              ;;
          esac

          dry_run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run=true
          fi

          {
            echo "version=$version"
            echo "npm_tag=$npm_tag"
            echo "prerelease=$prerelease"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $version to the $npm_tag tag (dry run: $dry_run)"

      - name: Build the packages
        run: npm/stage.sh "${{ steps.plan.outputs.version }}" "$RUNNER_TEMP/packages"

      # For anyone not installing through npm, and for whatever package manager
      # comes next: brew and scoop both want a tarball and a checksum. The
      # platform names are the ones grove doctor prints, so the archive to
      # download is the one named after what it says you are running.
      - name: Make the archives
        run: |
          set -euo pipefail
          version=${{ steps.plan.outputs.version }}
          mkdir -p "$RUNNER_TEMP/archives"
          for dir in "$RUNNER_TEMP"/packages/cli-*; do
            name=$(basename "$dir" | sed 's/^cli-//')
            tar -czf "$RUNNER_TEMP/archives/grove_${version}_${name}.tar.gz" \
              -C "$dir/bin" grove \
              -C "$GITHUB_WORKSPACE" LICENSE README.md
          done
          cd "$RUNNER_TEMP/archives"
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Kept even for a dry run, which is most of the point of having one.
      - uses: actions/upload-artifact@v6
        with:
          name: grove-${{ steps.plan.outputs.version }}
          path: ${{ runner.temp }}/archives/

      # As a draft, so nothing is visible until npm has the version too. The
      # tag already exists either way: it is what started this run.
      #
      # A release that is already there is the Releases page flow, where a
      # person wrote the notes and publishing created the tag. Add the archives
      # to what they wrote rather than replacing it.
      - name: Cut the GitHub release
        id: release
        if: steps.plan.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/archives/* --clobber
            # The tag is what says this is a prerelease, so an unticked box on
            # a -rc tag is a slip worth correcting rather than a preference.
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease
            fi
            # Whether it is still a draft, not whether this run drafted it. A
            # retry after a failed publish finds the draft its own first attempt
            # left behind, and has to finish the job rather than skip it.
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          else
            flags=(--generate-notes --draft)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --title "$TAG" "${flags[@]}" "$RUNNER_TEMP"/archives/*
            draft=true
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      # Last, because this is the step that cannot be taken back. The wrapper
      # goes after the four it depends on: its optionalDependencies are pinned
      # exactly, so publishing it first would put a manifest on the registry
      # naming versions that do not exist yet.
      # No NODE_AUTH_TOKEN on purpose. npm uses a token when it finds one and
      # only asks for an OIDC token when it does not, so leaving one here would
      # publish exactly as before and say nothing about trusted publishing
      # working. Provenance needs no flag either: trusted publishing signs.
      - name: Publish to npm
        if: steps.plan.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
        run: |
          set -euo pipefail
          npm --version

          # The wrapper last: its optionalDependencies are pinned exactly, so
          # publishing it before the four would name versions not yet there.
          # The glob sorts, and cli-* cannot match cli itself.
          for dir in "$RUNNER_TEMP"/packages/cli-* "$RUNNER_TEMP/packages/cli"; do
            name=$(node -p 'require("'"$dir"'/package.json").name')

            # Re-cutting a release whose publish failed partway is the recovery
            # this workflow is built for, and npm refuses a version it already
            # has. So what is already there counts as done rather than as a
            # failure that blocks the packages after it.
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already on the registry"
              continue
            fi

            if ! (cd "$dir" && npm publish --access public --tag "$NPM_TAG"); then
              echo "::error::$name did not publish. Trusted publishing is per package, so each of the five needs its own trusted publisher on npmjs.com; a 404 on a package that plainly exists is npm declining the OIDC token rather than a missing name."
              exit 1
            fi
          done

      # Last of all, so the release page appears only once the version it
      # describes is installable.
      - name: Make the release visible
        if: steps.plan.outputs.dry_run == 'false' && steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.plan.outputs.version }}" --draft=false

  # Installing what was actually published, on one runner per binary shipped.
  # The rehearsal proves the packages are right; this proves the right bytes
  # reached the registry and run on the machine they were built for.
  #
  # The macOS legs go further, because serving 443 there is not grove's own
  # doing and none of it is testable from a locally built binary: the daemon
  # re-executes os.Executable(), which under npm is a path inside node_modules.
  # This is also the only place grove install runs without --trust=false, so
  # the macOS keychain has no other coverage anywhere.
  verify:
    name: ${{ matrix.platform }} from npm
    needs: publish
    if: needs.publish.outputs.dry_run == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-26
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    # The install loop alone can spend ten minutes waiting on npm's mirrors.
    timeout-minutes: 25
    steps:
      # 22, not 24, on purpose: this stands in for a user, and 22 is the oldest
      # Node still supported. Nothing else exercises the shim on an older
      # client, and the shim is the hand-written half.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install it the way a person would
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # A version is not installable the instant it is published, so this
          # waits rather than failing a release over the registry catching up.
          # Minutes, not seconds: a name npm has never served before has to
          # reach every CDN edge, and the runners do not all ask the same one.
          # The first publish of @grove-sh/cli took over two minutes, and the
          # two Linux runners gave up while the two macOS ones did not.
          # What to wait on is grove running, not npm succeeding. The binary
          # arrives as an optional dependency, and npm's defined behaviour when
          # it cannot fetch one is to install the wrapper, leave the binary out,
          # and exit 0. A wrapper that has propagated ahead of its platform
          # package looks exactly like a successful install until you run it.
          #
          # Ten minutes, because npm's mirrors disagree for far longer than
          # seems reasonable. Publishing v0.1.0, two runners had it inside 13
          # seconds while the other two were still waiting after five minutes.
          # It costs nothing when the wait is short: the loop breaks on success.
          installed=false
          for attempt in $(seq 1 40); do
            # Which of the two waits this is, said out loud. Retrying without
            # saying why leaves a reader of the log no way to tell a registry
            # catching up from a package that will never work.
            if ! npm install -g "@grove-sh/cli@$VERSION" > "$RUNNER_TEMP/npm.log" 2>&1; then
              echo "attempt $attempt: npm cannot install it yet"
            elif [ "$(grove --version 2> /dev/null)" = "grove v$VERSION" ]; then
              installed=true
              break
            else
              echo "attempt $attempt: $(grove --version 2>&1 | head -1)"
            fi
            sleep 15
          done
          # Saying so here, rather than letting the next step report it as a
          # missing command and send the reader looking at PATH.
          if [ "$installed" != "true" ]; then
            echo "@grove-sh/cli@$VERSION never became runnable." >&2
            tail -5 "$RUNNER_TEMP/npm.log" >&2
            grove --version >&2 || true
            exit 1
          fi
          npm ls -g --depth 1 "@grove-sh/cli" || true

      - name: It is the build for this machine
        run: |
          set -euo pipefail
          # doctor names the platform it thinks it is running on, which is the
          # one thing that says the optional dependency npm chose was the right
          # one. It exits 1 on a machine with no CA installed, which every
          # runner is, so the exit code is not the question here.
          grove doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          if ! grep -Eq "^Platform[[:space:]]+${{ matrix.platform }}$" doctor.txt; then
            echo "this is not the ${{ matrix.platform }} build" >&2
            exit 1
          fi

      # No --trust=false, unlike anywhere else. This is what finds out whether
      # the keychain accepts the root, and a disposable runner is the only place
      # worth finding out.
      - name: Install the authority for real
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          grove install | tee install.txt

      # Running what it printed, rather than paths this file guessed at. The
      # instructions are the thing being tested: they are what a person pastes,
      # and a job that reconstructs them can pass while they are wrong. That is
      # not hypothetical, and the state directory here has a space in it.
      - name: Take the privileged step it printed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          grep -E '^[[:space:]]+sudo ' install.txt | sed 's/^[[:space:]]*//' > steps.sh
          echo "--- what install told me to run ---"
          cat steps.sh
          test -s steps.sh
          sh -e steps.sh
          sudo pfctl -a grove -s nat

      - name: It says it can serve 443 now
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          grove install | tee after.txt
          grep -q "pf sends 443 to" after.txt

      # doctor reads the trust store through Go's SystemCertPool, which on macOS
      # is the keychain, so this line is the keychain's own answer.
      - name: The machine trusts the root
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          grove doctor > trusted.txt 2>&1 || true
          cat trusted.txt
          if ! grep -Eq '^Authority[[:space:]]+installed and trusted' trusted.txt; then
            echo "the keychain did not take the root" >&2
            exit 1
          fi

      - name: It serves 443, from the binary npm installed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          grove start
          root="$HOME/Library/Application Support/grove/root.crt"

          # grove's own certificate, so this cannot pass because something else
          # answered. --resolve rather than DNS, since the address and port are
          # the question. A status curl dislikes still means TLS completed.
          curl -sS --fail-with-body --cacert "$root" \
            --resolve "ci.grov.site:443:127.0.0.4" \
            -o /dev/null -w 'reached grove on 443, http=%{http_code}\n' \
            "https://ci.grov.site/" || {
              status=$?
              test "$status" = "22"
              echo "reached grove on 443, and it had nothing to route"
            }

          # The daemon has to be the Go binary out of the platform package,
          # detached from the node process that asked for it.
          pid=$(pgrep -f 'grove daemon' | head -1 || true)
          if [ -z "$pid" ]; then
            echo "grove start returned, but no daemon is running" >&2
            exit 1
          fi
          # ps prints the full path on macOS, where Linux would truncate it.
          running=$(ps -o comm= -p "$pid")
          echo "daemon pid=$pid, running $running"
          case "$running" in
            *node_modules*grove) echo "it is the npm binary" ;;
            *) echo "the daemon is not the npm binary" >&2; exit 1 ;;
          esac

      # No uninstall step. Removing a trust root edits the admin trust settings,
      # which macOS gates behind an authorization prompt: security blocks until
      # someone answers it, and nobody can on a runner. Asking a person before
      # untrusting a root is the right behaviour, so there is nothing to fix
      # here and nothing to test without a human.
