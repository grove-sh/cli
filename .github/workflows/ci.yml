name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Use the runner's Go rather than downloading one named in go.mod.
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One platform failing should not hide the state of the others, which is
      # the whole point of running more than one.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Environment
        run: |
          go version
          go env GOOS GOARCH
          git version

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # macOS reaches every temporary directory through a symlink, since /var
  # resolves to /private/var, and git reports resolved paths. Pointing TMPDIR
  # through a symlink reproduces that on Linux, where the tests are quick.
  symlinked-tmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test with a symlinked TMPDIR
        run: |
          mkdir -p /tmp/real-tmp
          ln -sfn /tmp/real-tmp /tmp/linked-tmp
          TMPDIR=/tmp/linked-tmp go test -count=1 ./...

  # Upgrading grove leaves the previous release's daemon running, and the
  # restart that replaces it is the path every user takes exactly once. No
  # other job here exercises it: they all start from no daemon at all, which is
  # why a restart that could not read an older daemon's lease table shipped.
  #
  # High ports throughout, so none of this needs the privileged setup that
  # reaching 443 does.
  upgrade:
    runs-on: ubuntu-latest
    env:
      GROVE_STATE_DIR: ${{ github.workspace }}/upgrade-state
      GROVE_SOCKET: /tmp/grove-upgrade.sock
      GROVE_LISTEN: 127.0.0.4:18443
      GROVE_HTTP_LISTEN: 127.0.0.4:18080
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags, to find the release being upgraded from.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # The previous release built from its own source is the only honest old
      # daemon. A binary from this tree with a flag flipped would not have the
      # code that shipped.
      - name: Build the previous release, and this one
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-v:refname | head -1)
          test -n "$previous"
          echo "upgrading from $previous"
          git worktree add /tmp/previous "$previous"
          (cd /tmp/previous && go build -o "$RUNNER_TEMP/grove-old" ./cmd/grove)
          go build -o "$RUNNER_TEMP/grove-new" ./cmd/grove
          "$RUNNER_TEMP/grove-old" --version
          "$RUNNER_TEMP/grove-new" --version

      # Two projects, because the bug this guards against lost every project
      # but one and a single fixture could not tell the difference.
      - name: An old daemon holding two projects' ports
        run: |
          set -euo pipefail
          for name in one two; do
            dir="$RUNNER_TEMP/$name"
            mkdir -p "$dir"
            git -C "$dir" init -q -b main
            git -C "$dir" -c user.email=t@t -c user.name=t commit -q --allow-empty -m init
            # printf rather than a heredoc: the terminator would have to sit at
            # a column this file's indentation does not leave available.
            printf '%s\n' \
              '[routes.web]' 'dir = "."' 'env.PORT = "{port}"' '' \
              '[ports.db]' 'detached = true' 'env.DB_PORT = "{port}"' \
              > "$dir/grove.toml"
          done

          "$RUNNER_TEMP/grove-old" install --trust=false > /dev/null
          "$RUNNER_TEMP/grove-old" start
          (cd "$RUNNER_TEMP/one" && "$RUNNER_TEMP/grove-old" hold)
          (cd "$RUNNER_TEMP/two" && "$RUNNER_TEMP/grove-old" hold)

          "$RUNNER_TEMP/grove-old" ls --all | tee "$RUNNER_TEMP/before.txt"
          test "$(grep -c detached "$RUNNER_TEMP/before.txt")" = 2

      # From the workspace, which is neither project. Restoring the context you
      # happen to be standing in is what made a lost lease table look like a
      # clean restart.
      - name: This grove restarts it, from neither project
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/grove-new" restart
          "$RUNNER_TEMP/grove-new" ls --all | tee "$RUNNER_TEMP/after.txt"

          # Every project holds the ports it held, on the same numbers: a
          # restart derives them again rather than replaying the old table.
          for name in one two; do
            dir="$RUNNER_TEMP/$name"
            was=$(awk -v d="$dir" '$NF == d { print $2 }' "$RUNNER_TEMP/before.txt" | sort | tr '\n' ' ')
            now=$(awk -v d="$dir" '$NF == d { print $2 }' "$RUNNER_TEMP/after.txt" | sort | tr '\n' ' ')
            if [ -z "$now" ]; then
              echo "$name lost every lease across the upgrade" >&2
              exit 1
            fi
            if [ "$was" != "$now" ]; then
              echo "$name held [$was] before and holds [$now] now" >&2
              exit 1
            fi
          done

          # The daemon has to be this build. Doctor names a mismatch, so an old
          # daemon still serving would say so rather than read as running.
          "$RUNNER_TEMP/grove-new" doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          if ! grep -Eq '^Grove +running$' "$RUNNER_TEMP/doctor.txt"; then
            echo "the daemon is not this build, or not running" >&2
            exit 1
          fi

  # macOS is the platform where reaching 443 is not grove's own doing, so the
  # only honest test is to install it and ask for the port. This replaces the
  # spike that proved pf redirects local traffic: that answered a question about
  # macOS, this one answers a question about grove.
  macos-443:
    runs-on: macos-26
    env:
      # A space on purpose. macOS puts grove's state under ~/Library/Application
      # Support, so a path without one let this job pass while the instructions
      # install prints were being split into the wrong number of arguments.
      GROVE_STATE_DIR: ${{ github.workspace }}/grove state
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build -o grove ./cmd/grove

      # No trust store: this is about the port, and the keychain is its own
      # question. pipefail, because tee's exit code would otherwise hide an
      # install that failed and leave the next step reading an empty file.
      - name: Install, which stages the pf files and asks for one sudo
        run: |
          set -euo pipefail
          ./grove install --trust=false | tee install.txt

      # Running what it printed, rather than paths this file guessed at. The
      # instructions are the thing being tested: they are what a person will
      # paste, and a job that reconstructs them can pass while they are wrong.
      - name: Take the privileged step it asked for
        run: |
          set -euo pipefail
          grep -E '^[[:space:]]+sudo ' install.txt | sed 's/^[[:space:]]*//' > steps.sh
          echo "--- what install told me to run ---"
          cat steps.sh
          test -s steps.sh
          sh -e steps.sh
          sudo pfctl -a grove -s nat

      - name: Grove now reports it can serve 443
        run: |
          set -euo pipefail
          ./grove install --trust=false | tee after.txt
          grep -q "pf sends 443 to" after.txt

      - name: The daemon serves, and 443 arrives at it
        run: |
          set -euo pipefail
          ./grove restart
          # Grove's own certificate, so this cannot pass because something else
          # answered. --resolve rather than DNS, since the address and port are the
          # question. An HTTP status curl dislikes still means TLS completed.
          curl -sS --fail-with-body --cacert "$GROVE_STATE_DIR/root.crt" \
            --resolve "ci.grov.site:443:127.0.0.4" \
            -o /dev/null -w 'reached grove on 443, http=%{http_code}\n' \
            "https://ci.grov.site/" || {
              status=$?
              test "$status" = "22"
              echo "reached grove on 443, and it had nothing to route"
            }

      # For the log. It fails by design here, since --trust=false left the root
      # untrusted, so it reports rather than gates.
      - name: Doctor, for the record
        if: always()
        run: ./grove doctor || true

  # The npm packaging is JavaScript and shell that no Go test covers, and it is
  # otherwise only exercised while cutting a release, which is the worst moment
  # to learn it is broken. This is the same lesson as the --service flag that
  # sat removed in the code and still passed in a workflow for two commits.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm/rehearse.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      # No cgo anywhere, which is what keeps cross-compiling this simple.
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - run: go build ./...
