name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Use the runner's Go rather than downloading one named in go.mod.
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One platform failing should not hide the state of the others, which is
      # the whole point of running more than one.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Environment
        run: |
          go version
          go env GOOS GOARCH
          git version

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  # macOS reaches every temporary directory through a symlink, since /var
  # resolves to /private/var, and git reports resolved paths. Pointing TMPDIR
  # through a symlink reproduces that on Linux, where the tests are quick.
  symlinked-tmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test with a symlinked TMPDIR
        run: |
          mkdir -p /tmp/real-tmp
          ln -sfn /tmp/real-tmp /tmp/linked-tmp
          TMPDIR=/tmp/linked-tmp go test -count=1 ./...

  # macOS is the platform where reaching 443 is not grove's own doing, so the
  # only honest test is to install it and ask for the port. This replaces the
  # spike that proved pf redirects local traffic: that answered a question about
  # macOS, this one answers a question about grove.
  macos-443:
    runs-on: macos-26
    env:
      # A space on purpose. macOS puts grove's state under ~/Library/Application
      # Support, so a path without one let this job pass while the instructions
      # install prints were being split into the wrong number of arguments.
      GROVE_STATE_DIR: ${{ github.workspace }}/grove state
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build -o grove ./cmd/grove

      # No trust store: this is about the port, and the keychain is its own
      # question. pipefail, because tee's exit code would otherwise hide an
      # install that failed and leave the next step reading an empty file.
      - name: Install, which stages the pf files and asks for one sudo
        run: |
          set -euo pipefail
          ./grove install --trust=false | tee install.txt

      # Running what it printed, rather than paths this file guessed at. The
      # instructions are the thing being tested: they are what a person will
      # paste, and a job that reconstructs them can pass while they are wrong.
      - name: Take the privileged step it asked for
        run: |
          set -euo pipefail
          grep -E '^[[:space:]]+sudo ' install.txt | sed 's/^[[:space:]]*//' > steps.sh
          echo "--- what install told me to run ---"
          cat steps.sh
          test -s steps.sh
          sh -e steps.sh
          sudo pfctl -a grove -s nat

      - name: Grove now reports it can serve 443
        run: |
          set -euo pipefail
          ./grove install --trust=false | tee after.txt
          grep -q "pf sends 443 to" after.txt

      - name: The daemon serves, and 443 arrives at it
        run: |
          set -euo pipefail
          ./grove restart
          # Grove's own certificate, so this cannot pass because something else
          # answered the port. --resolve rather than DNS, since the port is the
          # question. An HTTP status curl dislikes still means TLS completed.
          curl -sS --fail-with-body --cacert "$GROVE_STATE_DIR/root.crt" \
            --resolve "ci.grov.site:443:127.0.0.1" \
            -o /dev/null -w 'reached grove on 443, http=%{http_code}\n' \
            "https://ci.grov.site/" || {
              status=$?
              test "$status" = "22"
              echo "reached grove on 443, and it had nothing to route"
            }

      # For the log. It fails by design here, since --trust=false left the root
      # untrusted, so it reports rather than gates.
      - name: Doctor, for the record
        if: always()
        run: ./grove doctor || true

  # The npm packaging is JavaScript and shell that no Go test covers, and it is
  # otherwise only exercised while cutting a release, which is the worst moment
  # to learn it is broken. This is the same lesson as the --service flag that
  # sat removed in the code and still passed in a workflow for two commits.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm/rehearse.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      # No cgo anywhere, which is what keeps cross-compiling this simple.
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - run: go build ./...
